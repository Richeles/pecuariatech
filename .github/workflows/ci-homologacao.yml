name: PecuariaTech - CI Homologacao

on:
  push:
    branches:
      - homologacao
  pull_request:
    branches:
      - homologacao
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-homologacao-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-and-build:
    name: Validar e compilar Next.js
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

    steps:
      - name: Obter código
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Verificar credenciais de homologação
        shell: bash
        run: |
          test -n "$NEXT_PUBLIC_SUPABASE_URL" || {
            echo "::error::Falta o Secret NEXT_PUBLIC_SUPABASE_URL"
            exit 1
          }
          test -n "$NEXT_PUBLIC_SUPABASE_ANON_KEY" || {
            echo "::error::Falta o Secret NEXT_PUBLIC_SUPABASE_ANON_KEY"
            exit 1
          }
          if [[ "$NEXT_PUBLIC_SUPABASE_URL" != *"dtgjpsumcrwwawbkphah"* ]]; then
            echo "::error::A URL não parece pertencer ao Supabase de homologação esperado."
            exit 1
          fi

      - name: Instalar dependências
        run: npm ci

      - name: Verificar TypeScript
        run: node ./node_modules/typescript/bin/tsc --noEmit --pretty false

      - name: Compilar Next.js
        run: npm run build
